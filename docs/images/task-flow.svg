<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b62"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#faf9f6"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1e1c17">What happens when you ask a question</text>

  <!-- step 1 -->
  <circle cx="90" cy="120" r="26" fill="#2f6b57"/>
  <text x="90" y="127" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">1</text>
  <text x="90" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1c17">Ask</text>
  <text x="90" y="196" text-anchor="middle" font-size="11" fill="#5b6b62">a research question</text>
  <text x="90" y="212" text-anchor="middle" font-size="11" fill="#5b6b62">in plain English</text>

  <!-- step 2 -->
  <circle cx="270" cy="120" r="26" fill="#2f6b57"/>
  <text x="270" y="127" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">2</text>
  <text x="270" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1c17">Plan</text>
  <text x="270" y="196" text-anchor="middle" font-size="11" fill="#5b6b62">complex tasks wait for</text>
  <text x="270" y="212" text-anchor="middle" font-size="11" fill="#5b6b62">your approval (default)</text>

  <!-- step 3 -->
  <circle cx="450" cy="120" r="26" fill="#2f6b57"/>
  <text x="450" y="127" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">3</text>
  <text x="450" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1c17">Run</text>
  <text x="450" y="196" text-anchor="middle" font-size="11" fill="#5b6b62">searches, database calls,</text>
  <text x="450" y="212" text-anchor="middle" font-size="11" fill="#5b6b62">code, every step logged</text>

  <!-- step 4 -->
  <circle cx="630" cy="120" r="26" fill="#2f6b57"/>
  <text x="630" y="127" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">4</text>
  <text x="630" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1c17">Answer</text>
  <text x="630" y="196" text-anchor="middle" font-size="11" fill="#5b6b62">with sources listed</text>
  <text x="630" y="212" text-anchor="middle" font-size="11" fill="#5b6b62">and follow-up questions</text>

  <!-- step 5 -->
  <circle cx="810" cy="120" r="26" fill="#2f6b57"/>
  <text x="810" y="127" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">5</text>
  <text x="810" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1c17">Check</text>
  <text x="810" y="196" text-anchor="middle" font-size="11" fill="#5b6b62">Review with a second model,</text>
  <text x="810" y="212" text-anchor="middle" font-size="11" fill="#5b6b62">export, publish or continue</text>

  <line x1="118" y1="120" x2="242" y2="120" stroke="#5b6b62" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="298" y1="120" x2="422" y2="120" stroke="#5b6b62" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="478" y1="120" x2="602" y2="120" stroke="#5b6b62" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="658" y1="120" x2="782" y2="120" stroke="#5b6b62" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="30" y="246" width="900" height="36" rx="8" fill="#e7f1ec"/>
  <text x="480" y="269" text-anchor="middle" font-size="12" fill="#1e1c17">You can also choose a mode: Manual plan (you approve every plan), Auto plan (default), or Fully automatic (no questions).</text>
</svg>
